<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | TaxNova</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css', v=ASSET_VERSION) }}">

    <style>
        body{
            margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
            font-family:'Poppins',-apple-system,'Segoe UI',sans-serif;
            background:radial-gradient(circle at 20% 20%, rgba(79,124,255,0.16), transparent 45%),
                       radial-gradient(circle at 80% 80%, rgba(124,58,237,0.14), transparent 45%),
                       var(--bg-base);
            color:var(--text-primary);
            padding:24px;
        }
        .box{ width:100%; max-width:420px; }
        input{
            width:100%; padding:13px 14px; border-radius:10px; border:1px solid var(--border-glass);
            background:var(--bg-elevated); color:var(--text-primary); font-family:inherit; margin-top:8px;
        }
        label{ font-size:13px; color:var(--text-muted); }
    </style>
</head>
<body>

    <div class="box tn-card tn-animate-in">
        <h2 style="margin:0 0 6px; font-size:22px;">Choose a new password</h2>
        <p style="color:var(--text-muted); font-size:13.5px; margin:0 0 20px;">
            Make it at least 6 characters.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="tn-alert {{ 'tn-alert-error' if category == 'error' else 'tn-alert-success' }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>New password</label>
            <input type="password" name="password" minlength="6" required>
            <button type="submit" class="tn-btn tn-btn-primary" style="width:100%; margin-top:18px;">
                <i class="fa-solid fa-check"></i> Update password
            </button>
        </form>
    </div>

</body>
</html>
