<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | TaxNova</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Google Font -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{

            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            overflow:hidden;

            background:
            linear-gradient(
            135deg,
            #020617,
            #0f172a,
            #1d4ed8,
            #14b8a6);

            position:relative;
        }

        /* Background Blobs */

        .blob{

            position:absolute;

            border-radius:50%;

            filter:blur(90px);

            opacity:0.5;

            animation:float 8s infinite ease-in-out;
        }

        .blob1{
            width:300px;
            height:300px;
            background:#14b8a6;
            top:-80px;
            left:-70px;
        }

        .blob2{
            width:260px;
            height:260px;
            background:#3b82f6;
            bottom:-60px;
            right:-50px;
        }

        .blob3{
            width:180px;
            height:180px;
            background:#facc15;
            top:50%;
            left:70%;
        }

        @keyframes float{

            0%{
                transform:translateY(0px);
            }

            50%{
                transform:translateY(20px);
            }

            100%{
                transform:translateY(0px);
            }
        }

        /* Login Card */

        .login-card{

            width:420px;

            padding:45px;

            border-radius:28px;

            background:rgba(255,255,255,0.10);

            border:1px solid rgba(255,255,255,0.15);

            backdrop-filter:blur(20px);

            color:white;

            box-shadow:
            0 8px 35px rgba(0,0,0,0.35);

            position:relative;

            z-index:10;

            animation:fadeIn 1s ease;
        }

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(40px);
            }

            to{
                opacity:1;
                transform:translateY(0px);
            }
        }

        /* Logo */

        .logo{

            text-align:center;

            margin-bottom:10px;
        }

        .logo i{

            font-size:40px;

            color:#facc15;
        }

        .logo h1{

            margin-top:10px;

            font-size:32px;

            font-weight:700;
        }

        .subtitle{

            text-align:center;

            color:#dbeafe;

            margin-bottom:35px;

            font-size:14px;
        }

        /* Inputs */

        .input-box{

            position:relative;

            margin-bottom:22px;
        }

        .input-box input{

            width:100%;

            padding:14px 14px 14px 50px;

            border:none;

            outline:none;

            border-radius:14px;

            background:rgba(255,255,255,0.12);

            color:white;

            transition:0.3s;
        }

        .input-box input::placeholder{
            color:#d1d5db;
        }

        .input-box input:focus{

            background:rgba(255,255,255,0.18);

            box-shadow:
            0 0 15px rgba(59,130,246,0.7);
        }

        .input-box i{

            position:absolute;

            top:15px;
            left:18px;

            color:#93c5fd;
        }

        /* Button */

        .login-btn{

            width:100%;

            padding:14px;

            border:none;

            border-radius:14px;

            background:
            linear-gradient(to right,
            #14b8a6,
            #2563eb);

            color:white;

            font-weight:600;

            transition:0.3s;
        }

        .login-btn:hover{

            transform:translateY(-2px) scale(1.02);
	    letter-spacing:0.5px;
            box-shadow:
            0 8px 25px rgba(37,99,235,0.5);
        }

        /* Bottom Text */

        .bottom-text{

            margin-top:20px;

            text-align:center;

            font-size:14px;

            color:#dbeafe;
        }

        .bottom-text a{

            color:#facc15;

            text-decoration:none;

            font-weight:600;
        }

        .bottom-text a:hover{
            text-decoration:underline;
        }

        /* Small Badge */

        .badge-tax{

            position:absolute;

            top:20px;
            right:20px;

            background:rgba(250,204,21,0.15);

            border:1px solid rgba(250,204,21,0.3);

            padding:8px 14px;

            border-radius:50px;

            color:#facc15;

            font-size:12px;
        }

    </style>

</head>

<body>

    <!-- Background -->

    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>

    <!-- Login Card -->

    <div class="login-card">

        <div class="badge-tax">
            Secure Login
        </div>

        <div class="logo">

            <i class="fa-solid fa-chart-line"></i>

            <h1>TaxNova</h1>

        </div>

        <div class="subtitle">

            India's smart tax filing assistant ⚡

        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div style="background: {{ 'rgba(220,53,69,0.15)' if category == 'error' else 'rgba(40,167,69,0.15)' }};
                                border: 1px solid {{ '#dc3545' if category == 'error' else '#28a745' }};
                                color: {{ '#ff8a8a' if category == 'error' else '#7ee89b' }};
                                padding: 10px 14px;
                                border-radius: 10px;
                                font-size: 13px;
                                margin-bottom: 14px;
                                text-align: center;">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input type="email"
			name="email"
                       placeholder="Email Address"
                       value="{{ request.form.email or '' }}"
                       required
		       autofocus>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input type="password"
			name="password"
                       id="loginPassword"
                       placeholder="Password"
                       required>

                <i class="fa-solid fa-eye" id="toggleLoginPassword"
                   style="cursor:pointer; opacity:.6;"></i>

            </div>

            <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:#cbd5e1; margin:14px 0 20px; cursor:pointer;">
                <input type="checkbox" name="remember_me" style="width:auto; accent-color:#4f7cff;">
                Keep me signed in on this device
            </label>

            <button type="submit"
                    class="login-btn">

                Login

            </button>

<div class="text-center mt-3">

    <a href="{{ url_for('forgot_password') }}"
       style="color:#cbd5e1;
              font-size:13px;
              text-decoration:none;">

        Forgot Password?

    </a>

</div>

        </form>

        <div class="bottom-text">

            Don't have an account?

            <a href="/register">

                Register

            </a>

        </div>

    </div>

<script>
    const toggleLoginPassword = document.getElementById('toggleLoginPassword');
    const loginPassword = document.getElementById('loginPassword');
    if (toggleLoginPassword) {
        toggleLoginPassword.addEventListener('click', () => {
            const isHidden = loginPassword.type === 'password';
            loginPassword.type = isHidden ? 'text' : 'password';
            toggleLoginPassword.classList.toggle('fa-eye');
            toggleLoginPassword.classList.toggle('fa-eye-slash');
        });
    }
</script>
</body>

</html>
